# Render Blueprint for Dalal Al-Iraq (iraq-smart-finder)
services:
  - type: web
    name: iraq-smart-finder
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
