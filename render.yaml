# Render Blueprint for Dalal Al-Iraq (iraq-smart-finder)
services:
  - type: web
    name: iraq-smart-finder
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # الميزات غير المكتملة معطلة صراحةً في الإنتاج (انظر .env.example)
      - key: DEMO_MODE
        value: "false"
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: ALERTS_DELIVERY_ENABLED
        value: "false"
      # مفتاح سيربر يُدخل يدوياً من لوحة رندر ولا يُحفظ في المستودع
      - key: SERPER_API_KEY
        sync: false
