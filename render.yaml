# Render Blueprint for Dalal Al-Iraq (iraq-smart-finder)
services:
  - type: web
    name: iraq-smart-finder
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # الميزات غير المكتملة معطلة صراحةً في الإنتاج (انظر .env.example)
      - key: DEMO_MODE
        value: "false"
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: ALERTS_DELIVERY_ENABLED
        value: "false"
      # مفتاح سيربر يُدخل يدوياً من لوحة رندر ولا يُحفظ في المستودع
      - key: SERPER_API_KEY
        sync: false
      # رمز التحديث الليلي يُدخل يدوياً ويطابق سر REFRESH_TOKEN في غيت‌هب
      - key: ADMIN_REFRESH_TOKEN
        sync: false
      # تسجيل الدخول بغوغل والدفع عبر كي كارد (تُدخل القيم يدوياً من لوحة رندر)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://iraq-smart-finder.onrender.com
      - key: QICARD_API_BASE
        sync: false
      - key: QICARD_USERNAME
        sync: false
      - key: QICARD_PASSWORD
        sync: false
      - key: QICARD_TERMINAL_ID
        sync: false
